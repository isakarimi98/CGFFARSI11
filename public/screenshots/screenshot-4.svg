<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; direction: rtl; unicode-bidi: embed; }
      .bg-app { fill: #f0f2f5; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 8px; }
      .input-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 6px; }
      .btn-blue { fill: #2563eb; rx: 6px; }
      .btn-outline { fill: #ffffff; stroke: #2563eb; stroke-width: 1; rx: 6px; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" class="bg-app"/>

  <!-- Header -->
  <rect x="20" y="20" width="1160" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="8" filter="url(#shadow)"/>
  <g transform="translate(1140, 48)">
    <text x="0" y="0" fill="#0f172a" font-size="18" font-weight="800" text-anchor="end">⚙️ تنظیمات یابنده شکاف محتوا</text>
    <circle cx="-250" cy="-6" r="4" fill="#22c55e"/>
    <text x="-260" y="0" fill="#16a34a" font-size="11" font-weight="700" text-anchor="end">ارتباط هوش مصنوعی: آنلاین (OPENROUTER)</text>
    <text x="0" y="24" fill="#64748b" font-size="12" font-weight="500" text-anchor="end">پیکربندی کلیدهای API و مدل‌های هوش مصنوعی جهت تحلیل ساختار محتوایی سایت.</text>
  </g>

  <!-- Section 1: AI Provider Settings -->
  <rect x="20" y="125" width="1160" height="310" class="card" filter="url(#shadow)"/>
  
  <!-- Section Title -->
  <g transform="translate(1140, 155)">
    <text x="0" y="0" fill="#0f172a" font-size="15" font-weight="800" text-anchor="end">🔀 تنظیمات ارائه‌دهنده هوش مصنوعی</text>
    <line x1="-1120" y1="15" x2="0" y2="15" stroke="#f1f5f9" stroke-width="1"/>
  </g>

  <!-- Field 1: AI Provider -->
  <g transform="translate(20, 190)">
    <text x="1120" y="20" fill="#1e293b" font-size="13" font-weight="700" text-anchor="end">ارائه‌دهنده سرویس (AI Provider)</text>
    <rect x="280" y="30" width="840" height="42" class="input-box"/>
    <text x="1100" y="56" fill="#0f172a" font-size="13" font-weight="600" text-anchor="end">OpenRouter (پیش‌فرض)</text>
    <!-- Arrow -->
    <path d="M295 48l5 5 5-5" stroke="#64748b" stroke-width="2" fill="none"/>
    <text x="1120" y="90" fill="#64748b" font-size="11" font-weight="500" text-anchor="end">سرویس‌دهنده مورد نظر برای استخراج فرصت‌های محتوایی را انتخاب کنید.</text>
  </g>

  <!-- Field 2: AI Model -->
  <g transform="translate(20, 290)">
    <text x="1120" y="20" fill="#1e293b" font-size="13" font-weight="700" text-anchor="end">مدل هوش مصنوعی (Model)</text>
    <rect x="280" y="30" width="840" height="42" class="input-box"/>
    <text x="1100" y="56" fill="#0f172a" font-size="13" font-weight="600" text-anchor="end">OpenAI GPT-4o Mini (openai/gpt-4o-mini)</text>
    <path d="M295 48l5 5 5-5" stroke="#64748b" stroke-width="2" fill="none"/>
    <text x="1120" y="90" fill="#64748b" font-size="11" font-weight="500" text-anchor="end">شناسه رسمی API مدل هوش مصنوعی را انتخاب نمایید.</text>
  </g>

  <!-- Field 3: API Key -->
  <g transform="translate(20, 390)">
    <!-- Label -->
    <text x="1120" y="-10" fill="#1e293b" font-size="13" font-weight="700" text-anchor="end">کلید اختصاصی API (API Key)</text>
    <!-- Key Input -->
    <rect x="280" y="0" width="840" height="42" class="input-box"/>
    <text x="1100" y="26" fill="#0f172a" font-size="15" font-weight="800" text-anchor="end" letter-spacing="3">••••••••••••••••••••••••••••••••••••••••</text>
    <!-- Test API Button -->
    <rect x="130" y="0" width="135" height="42" class="btn-outline"/>
    <text x="197" y="26" fill="#2563eb" font-size="12" font-weight="700" text-anchor="middle">🔀 تست اتصال API</text>
    <text x="1120" y="58" fill="#64748b" font-size="11" font-weight="500" text-anchor="end">کلید API صادر شده از سرویس‌دهنده انتخابی را وارد کنید. کلید به صورت ایمن ذخیره می‌شود.</text>
  </g>

  <!-- Section 2: Analysis Parameters Settings -->
  <rect x="20" y="450" width="1160" height="150" class="card" filter="url(#shadow)"/>

  <g transform="translate(1140, 475)">
    <text x="0" y="0" fill="#0f172a" font-size="15" font-weight="800" text-anchor="end">📊 تنظیمات پارامترهای تحلیل</text>
    <line x1="-1120" y1="15" x2="0" y2="15" stroke="#f1f5f9" stroke-width="1"/>
  </g>

  <g transform="translate(20, 505)">
    <text x="1120" y="20" fill="#1e293b" font-size="13" font-weight="700" text-anchor="end">تعداد پیشنهادها در هر اسکن</text>
    <rect x="760" y="30" width="360" height="42" class="input-box"/>
    <text x="1100" y="56" fill="#0f172a" font-size="13" font-weight="600" text-anchor="end">5 پیشنهاد</text>
    <path d="M775 48l5 5 5-5" stroke="#64748b" stroke-width="2" fill="none"/>
    <text x="1120" y="90" fill="#64748b" font-size="11" font-weight="500" text-anchor="end">تعداد موضوعات جدیدی که در هر مرحله اسکن و تحلیل توسط مدل به زبان فارسی توصیه می‌شوند.</text>
  </g>

  <!-- Bottom Save Button -->
  <g transform="translate(40, 615)">
    <rect x="0" y="0" width="140" height="42" class="btn-blue"/>
    <text x="70" y="26" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">ذخیره تنظیمات</text>
  </g>
</svg>
