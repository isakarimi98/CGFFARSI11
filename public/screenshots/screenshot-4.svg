<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; direction: rtl; unicode-bidi: embed; }
      .bg-app { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 12px; }
      .input-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 8px; }
      .btn-blue { fill: #2563eb; rx: 8px; }
      .btn-outline { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; rx: 8px; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" class="bg-app"/>

  <!-- Header -->
  <rect x="24" y="24" width="752" height="80" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="12" filter="url(#shadow)"/>
  <g transform="translate(748, 55)">
    <text x="0" y="0" fill="#0f172a" font-size="18" font-weight="800" text-anchor="end">⚙️ تنظیمات اتصال به سرویس‌های هوش مصنوعی</text>
    <text x="0" y="24" fill="#64748b" font-size="12" font-weight="500" text-anchor="end">پیکربندی کلید API و ارائه‌دهنده سرویس (OpenRouter / OpenAI / Gemini)</text>
  </g>

  <!-- Main Settings Card -->
  <rect x="24" y="120" width="752" height="656" class="card" filter="url(#shadow)"/>

  <!-- AI Provider Section Header -->
  <g transform="translate(728, 155)">
    <text x="0" y="0" fill="#0f172a" font-size="15" font-weight="800" text-anchor="end">🔀 تنظیمات ارائه‌دهنده سرویس (AI Provider)</text>
    <line x1="-704" y1="15" x2="0" y2="15" stroke="#f1f5f9" stroke-width="1"/>
  </g>

  <!-- Field 1: AI Provider Dropdown -->
  <g transform="translate(24, 190)">
    <text x="704" y="20" fill="#1e293b" font-size="13" font-weight="700" text-anchor="end">ارائه‌دهنده سرویس (AI Provider)</text>
    <rect x="0" y="32" width="704" height="46" class="input-box"/>
    <text x="680" y="60" fill="#0f172a" font-size="13" font-weight="600" text-anchor="end">OpenRouter (پیش‌فرض پیشنهادی)</text>
    <path d="M20 52l6 6 6-6" stroke="#64748b" stroke-width="2" fill="none"/>
    <text x="704" y="98" fill="#64748b" font-size="11" font-weight="500" text-anchor="end">سرویس‌دهنده هوش مصنوعی جهت تحلیل ساختار محتوا را انتخاب نمایید.</text>
  </g>

  <!-- Field 2: Model Name Input -->
  <g transform="translate(24, 310)">
    <text x="704" y="20" fill="#1e293b" font-size="13" font-weight="700" text-anchor="end">مدل هوش مصنوعی (Model)</text>
    <rect x="0" y="32" width="704" height="46" class="input-box"/>
    <text x="680" y="60" fill="#0f172a" font-size="13" font-weight="600" text-anchor="end">OpenAI GPT-4o Mini (openai/gpt-4o-mini)</text>
    <path d="M20 52l6 6 6-6" stroke="#64748b" stroke-width="2" fill="none"/>
    <text x="704" y="98" fill="#64748b" font-size="11" font-weight="500" text-anchor="end">شناسه رسمی مدل هوش مصنوعی انتخابی خود را وارد نمایید.</text>
  </g>

  <!-- Field 3: API Key Field -->
  <g transform="translate(24, 430)">
    <text x="704" y="20" fill="#1e293b" font-size="13" font-weight="700" text-anchor="end">کلید اختصاصی API Key</text>
    
    <rect x="150" y="32" width="554" height="46" class="input-box"/>
    <text x="680" y="60" fill="#0f172a" font-size="16" font-weight="800" text-anchor="end" letter-spacing="3">••••••••••••••••••••••••••••••••••••••••</text>

    <!-- Test Connection Button -->
    <rect x="0" y="32" width="138" height="46" class="btn-outline"/>
    <text x="69" y="60" fill="#2563eb" font-size="12" font-weight="700" text-anchor="middle">🔀 تست اتصال</text>

    <text x="704" y="98" fill="#64748b" font-size="11" font-weight="500" text-anchor="end">کلید API صادر شده از سرویس‌دهنده را وارد کنید. کلید به صورت ایمن ذخیره می‌شود.</text>
  </g>

  <!-- Field 4: Scan Recommendations Count -->
  <g transform="translate(24, 550)">
    <text x="704" y="20" fill="#1e293b" font-size="13" font-weight="700" text-anchor="end">تعداد پیشنهادها در هر اسکن</text>
    <rect x="350" y="32" width="354" height="46" class="input-box"/>
    <text x="680" y="60" fill="#0f172a" font-size="13" font-weight="600" text-anchor="end">5 پیشنهاد در هر مرحله</text>
    <path d="M370 52l6 6 6-6" stroke="#64748b" stroke-width="2" fill="none"/>
    <text x="704" y="98" fill="#64748b" font-size="11" font-weight="500" text-anchor="end">تعداد موضوعات جدیدی که در هر اسکن توسط مدل به زبان فارسی تولید می‌شوند.</text>
  </g>

  <!-- Save Settings Button -->
  <g transform="translate(48, 680)">
    <rect width="180" height="48" class="btn-blue" filter="url(#shadow)"/>
    <text x="90" y="30" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">ذخیره تنظیمات 💾</text>
  </g>
</svg>
