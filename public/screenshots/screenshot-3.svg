<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; direction: rtl; unicode-bidi: embed; }
      .bg-app { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 12px; }
      .badge-prio-high { fill: #fce7f3; stroke: #f472b6; stroke-width: 0.5; }
      .badge-prio-mid { fill: #fef9c3; stroke: #fde047; stroke-width: 0.5; }
      .pill-cat { fill: #e0f2fe; stroke: #bae6fd; stroke-width: 0.5; }
      .btn-restore { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; rx: 6px; }
      .btn-delete { fill: #dc2626; rx: 6px; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" class="bg-app"/>

  <!-- Top Header -->
  <rect x="24" y="24" width="752" height="80" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="12" filter="url(#shadow)"/>
  <g transform="translate(748, 55)">
    <text x="0" y="0" fill="#0f172a" font-size="18" font-weight="800" text-anchor="end">🗑️ لیست فرصت‌های رد شده (۹ موضوع)</text>
    <text x="0" y="24" fill="#64748b" font-size="12" font-weight="500" text-anchor="end">امکان بازگردانی به لیست فعال یا حذف کامل از دیتابیس</text>
  </g>

  <!-- Global Action Buttons -->
  <g transform="translate(24, 120)">
    <rect x="562" y="0" width="214" height="42" fill="#dc2626" rx="8"/>
    <text x="669" y="26" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">🗑️ حذف دائمی همه موارد</text>

    <rect x="330" y="0" width="214" height="42" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" rx="8"/>
    <text x="437" y="26" fill="#2563eb" font-size="12" font-weight="800" text-anchor="middle">🔄 بازگردانی همگی به لیست فعال</text>
  </g>

  <!-- Table Container -->
  <rect x="24" y="180" width="752" height="596" class="card" filter="url(#shadow)"/>

  <!-- Header -->
  <rect x="24" y="180" width="752" height="45" fill="#f8fafc" rx="12 12 0 0"/>
  <line x1="24" y1="225" x2="776" y2="225" stroke="#e2e8f0" stroke-width="1"/>

  <g transform="translate(0, 208)">
    <text x="750" y="0" fill="#334155" font-size="12" font-weight="800" text-anchor="end">عنوان / موضوع رد شده</text>
    <text x="480" y="0" fill="#334155" font-size="12" font-weight="800" text-anchor="end">دسته‌بندی</text>
    <text x="360" y="0" fill="#334155" font-size="12" font-weight="800" text-anchor="end">اولویت</text>
    <text x="220" y="0" fill="#334155" font-size="12" font-weight="800" text-anchor="end">عملیات مدیریت</text>
  </g>

  <!-- Row 1 -->
  <g transform="translate(0, 235)">
    <line x1="24" y1="105" x2="776" y2="105" stroke="#f1f5f9" stroke-width="1"/>
    <text x="750" y="28" fill="#0f172a" font-size="13" font-weight="800" text-anchor="end">راهنمای جامع سفر به کوه‌های زاگرس: نکات و ترفندها</text>
    <text x="750" y="52" fill="#64748b" font-size="11" font-weight="500" text-anchor="end">دلیل رد: شباهت بالای محتوا به مقاله منتشر شده قبلی در همین دسته.</text>

    <rect x="420" y="20" width="90" height="24" class="pill-cat" rx="12"/>
    <text x="465" y="36" fill="#0369a1" font-size="11" font-weight="700" text-anchor="middle">مقاصد گردشگری</text>

    <rect x="315" y="20" width="80" height="24" class="badge-prio-high" rx="12"/>
    <text x="355" y="36" fill="#9d174d" font-size="11" font-weight="800" text-anchor="middle">بالا (فوری)</text>

    <g transform="translate(130, 18)">
      <rect width="105" height="32" class="btn-restore"/>
      <text x="52" y="21" fill="#2563eb" font-size="11" font-weight="700" text-anchor="middle">🔄 بازگردانی</text>

      <rect x="-85" y="0" width="75" height="32" class="btn-delete"/>
      <text x="-47" y="21" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">حذف دائمی</text>
    </g>
  </g>

  <!-- Row 2 -->
  <g transform="translate(0, 350)">
    <line x1="24" y1="105" x2="776" y2="105" stroke="#f1f5f9" stroke-width="1"/>
    <text x="750" y="28" fill="#0f172a" font-size="13" font-weight="800" text-anchor="end">راهنمای جامع انتخاب بهترین زمان سفر به جنگل‌های ایران</text>
    <text x="750" y="52" fill="#64748b" font-size="11" font-weight="500" text-anchor="end">دلیل رد: نیاز به تکمیل اطلاعات اولویت‌بندی فصل‌ها.</text>

    <rect x="420" y="20" width="90" height="24" class="pill-cat" rx="12"/>
    <text x="465" y="36" fill="#0369a1" font-size="11" font-weight="700" text-anchor="middle">مقاصد گردشگری</text>

    <rect x="315" y="20" width="80" height="24" class="badge-prio-high" rx="12"/>
    <text x="355" y="36" fill="#9d174d" font-size="11" font-weight="800" text-anchor="middle">بالا (فوری)</text>

    <g transform="translate(130, 18)">
      <rect width="105" height="32" class="btn-restore"/>
      <text x="52" y="21" fill="#2563eb" font-size="11" font-weight="700" text-anchor="middle">🔄 بازگردانی</text>

      <rect x="-85" y="0" width="75" height="32" class="btn-delete"/>
      <text x="-47" y="21" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">حذف دائمی</text>
    </g>
  </g>

  <!-- Row 3 -->
  <g transform="translate(0, 465)">
    <line x1="24" y1="105" x2="776" y2="105" stroke="#f1f5f9" stroke-width="1"/>
    <text x="750" y="28" fill="#0f172a" font-size="13" font-weight="800" text-anchor="end">راهنمای انتخاب بهترین تجهیزات کوهنوردی سنگین</text>
    <text x="750" y="52" fill="#64748b" font-size="11" font-weight="500" text-anchor="end">دلیل رد: اولویت کمتر نسبت به بخش‌های عمومی‌تر.</text>

    <rect x="420" y="20" width="90" height="24" class="pill-cat" rx="12"/>
    <text x="465" y="36" fill="#0369a1" font-size="11" font-weight="700" text-anchor="middle">تجهیزات سفر</text>

    <rect x="315" y="20" width="80" height="24" class="badge-prio-mid" rx="12"/>
    <text x="355" y="36" fill="#854d0e" font-size="11" font-weight="800" text-anchor="middle">متوسط</text>

    <g transform="translate(130, 18)">
      <rect width="105" height="32" class="btn-restore"/>
      <text x="52" y="21" fill="#2563eb" font-size="11" font-weight="700" text-anchor="middle">🔄 بازگردانی</text>

      <rect x="-85" y="0" width="75" height="32" class="btn-delete"/>
      <text x="-47" y="21" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">حذف دائمی</text>
    </g>
  </g>

  <!-- Row 4 -->
  <g transform="translate(0, 580)">
    <text x="750" y="28" fill="#0f172a" font-size="13" font-weight="800" text-anchor="end">روش‌های تعامل با اهل مناطق محلی در سفر</text>
    <text x="750" y="52" fill="#64748b" font-size="11" font-weight="500" text-anchor="end">دلیل رد: غیر مرتبط با تمرکز تخصصی فعلی سایت.</text>

    <rect x="420" y="20" width="90" height="24" class="pill-cat" rx="12"/>
    <text x="465" y="36" fill="#0369a1" font-size="11" font-weight="700" text-anchor="middle">مقاصد گردشگری</text>

    <rect x="315" y="20" width="80" height="24" class="badge-prio-mid" rx="12"/>
    <text x="355" y="36" fill="#854d0e" font-size="11" font-weight="800" text-anchor="middle">متوسط</text>

    <g transform="translate(130, 18)">
      <rect width="105" height="32" class="btn-restore"/>
      <text x="52" y="21" fill="#2563eb" font-size="11" font-weight="700" text-anchor="middle">🔄 بازگردانی</text>

      <rect x="-85" y="0" width="75" height="32" class="btn-delete"/>
      <text x="-47" y="21" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">حذف دائمی</text>
    </g>
  </g>
</svg>
