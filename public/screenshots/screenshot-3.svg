<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" width="100%" height="100%">
  <defs>
    <style>
      text { font-family: 'Tahoma', 'Segoe UI', 'Vazirmatn', -apple-system, sans-serif; }
      .bg-app { fill: #f1f3f5; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 8px; }
      .badge-online { fill: #dcfce7; stroke: #86efac; stroke-width: 0.5; }
      .badge-prio-high { fill: #fce7f3; stroke: #f472b6; stroke-width: 0.5; }
      .badge-prio-mid { fill: #fef9c3; stroke: #fde047; stroke-width: 0.5; }
      .badge-prio-low { fill: #e0f2fe; stroke: #bae6fd; stroke-width: 0.5; }
      .pill-cat { fill: #f0f9ff; stroke: #bae6fd; stroke-width: 0.5; }
      .pill-kw { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 0.5; }
      .btn-approve { fill: #2563eb; rx: 4px; }
      .btn-reject { fill: #dc2626; rx: 4px; }
      .tab-active { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; rx: 6px; }
      .tab-inactive { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 6px; }
    </style>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="960" class="bg-app"/>

  <!-- Top Scan Banner Header -->
  <rect x="16" y="16" width="968" height="95" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="8" filter="url(#shadow)"/>
  
  <!-- Left Scan Button -->
  <g transform="translate(36, 38)">
    <rect width="250" height="42" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="225" y="26" fill="#334155" font-size="12.5" font-weight="700" text-anchor="start">اسکن سایت برای یافتن شکاف‌های محتوا 🔍</text>
  </g>

  <!-- Right Title & Online Badge -->
  <g transform="translate(952, 48)">
    <text x="0" y="0" fill="#0f172a" font-size="18" font-weight="800" text-anchor="end">🔍 کشف فرصت‌های محتوا</text>

    <g transform="translate(-230, -20)">
      <rect width="210" height="26" class="badge-online" rx="13"/>
      <circle cx="192" cy="13" r="3.5" fill="#16a34a"/>
      <text x="180" y="17" fill="#15803d" font-size="10.5" font-weight="700" text-anchor="end">ارتباط هوش مصنوعی: آنلاین (OPENROUTER)</text>
    </g>

    <text x="0" y="25" fill="#64748b" font-size="11.5" font-weight="500" text-anchor="end">تحلیل هوشمند ساختار وب‌سایت شما و کلیدواژه‌های مناسب جهت استخراج فرصت‌ها و موضوعات غایب.</text>
  </g>

  <!-- Middle Toolbar: Exports, Tabs, Search -->
  <g transform="translate(16, 122)">
    <!-- Right: Exports -->
    <text x="968" y="26" fill="#64748b" font-size="11.5" font-weight="600" text-anchor="end">خروجی گرفتن:</text>
    <rect x="850" y="0" width="95" height="38" fill="#ffffff" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="897" y="24" fill="#2563eb" font-size="11.5" font-weight="700" text-anchor="middle">📥 دانلود JSON</text>

    <rect x="745" y="0" width="95" height="38" fill="#ffffff" stroke="#2563eb" stroke-width="1" rx="6"/>
    <text x="792" y="24" fill="#2563eb" font-size="11.5" font-weight="700" text-anchor="middle">📥 دانلود CSV</text>

    <!-- Center: Tabs -->
    <rect x="585" y="0" width="145" height="38" class="tab-active"/>
    <text x="688" y="24" fill="#2563eb" font-size="12" font-weight="800" text-anchor="end">فرصت‌های فعال</text>
    <rect x="600" y="8" width="22" height="22" fill="#2563eb" rx="11"/>
    <text x="611" y="23" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">5</text>

    <rect x="425" y="0" width="150" height="38" class="tab-inactive"/>
    <text x="548" y="24" fill="#475569" font-size="12" font-weight="700" text-anchor="end">فرصت‌های تایید شده</text>
    <rect x="440" y="8" width="22" height="22" fill="#dcfce7" rx="11"/>
    <text x="451" y="23" fill="#15803d" font-size="11" font-weight="800" text-anchor="middle">1</text>

    <rect x="270" y="0" width="145" height="38" class="tab-inactive"/>
    <text x="390" y="24" fill="#475569" font-size="12" font-weight="700" text-anchor="end">فرصت‌های رد شده</text>
    <rect x="285" y="8" width="22" height="22" fill="#fee2e2" rx="11"/>
    <text x="296" y="23" fill="#b91c1c" font-size="11" font-weight="800" text-anchor="middle">9</text>

    <!-- Left: Search input -->
    <rect x="0" y="0" width="255" height="38" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <text x="240" y="24" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="end">🔍 جستجو در عنوان، کلمات کلیدی، دسته‌بندی...</text>
  </g>

  <!-- Table Container -->
  <rect x="16" y="172" width="968" height="740" class="card" filter="url(#shadow)"/>

  <!-- Table Header -->
  <rect x="16" y="172" width="968" height="42" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(0, 198)">
    <text x="948" y="0" fill="#334155" font-size="12" font-weight="800" text-anchor="end">عنوان / موضوع</text>
    <text x="730" y="0" fill="#334155" font-size="12" font-weight="800" text-anchor="end">کلمات کلیدی هدف</text>
    <text x="570" y="0" fill="#334155" font-size="12" font-weight="800" text-anchor="end">دسته‌بندی محتوا</text>
    <text x="450" y="0" fill="#334155" font-size="12" font-weight="800" text-anchor="end">اولویت</text>
    <text x="320" y="0" fill="#334155" font-size="12" font-weight="800" text-anchor="end">دلیل استراتژیک</text>
    <text x="80" y="0" fill="#334155" font-size="12" font-weight="800" text-anchor="end">عملیات</text>
  </g>

  <!-- Row 1 -->
  <g transform="translate(0, 215)">
    <line x1="16" y1="130" x2="984" y2="130" stroke="#f1f5f9" stroke-width="1"/>
    
    <text x="948" y="32" fill="#0f172a" font-size="13" font-weight="800" text-anchor="end">نکات کلیدی برای انتخاب</text>
    <text x="948" y="52" fill="#0f172a" font-size="13" font-weight="800" text-anchor="end">بهترین زمان سفر به کویر</text>

    <!-- Keywords -->
    <g transform="translate(630, 20)">
      <rect x="110" y="0" width="70" height="22" class="pill-kw" rx="11"/>
      <text x="145" y="15" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">سفر به کویر</text>

      <rect x="20" y="0" width="82" height="22" class="pill-kw" rx="11"/>
      <text x="61" y="15" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">زمان مناسب سفر</text>

      <rect x="110" y="28" width="70" height="22" class="pill-kw" rx="11"/>
      <text x="145" y="43" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">کوهنوردی</text>
    </g>

    <!-- Category -->
    <rect x="520" y="20" width="90" height="24" class="pill-cat" rx="12"/>
    <text x="565" y="36" fill="#0369a1" font-size="11" font-weight="700" text-anchor="middle">مقاصد گردشگری</text>

    <!-- Priority -->
    <rect x="410" y="20" width="80" height="24" class="badge-prio-high" rx="12"/>
    <text x="450" y="36" fill="#9d174d" font-size="11" font-weight="800" text-anchor="middle">بالا (فوری)</text>

    <!-- Strategic Reason -->
    <text x="380" y="28" fill="#475569" font-size="11" font-weight="500" text-anchor="end">این موضوع به دلیل اهمیت زیادش در سفر به کویر و تأثیر</text>
    <text x="380" y="46" fill="#475569" font-size="11" font-weight="500" text-anchor="end">آن بر تجربه گردشگری، یک ضرورت است. افزودن این مطلب</text>
    <text x="380" y="64" fill="#475569" font-size="11" font-weight="500" text-anchor="end">به جذب مخاطبان بیشتری کمک می‌کند.</text>

    <!-- Buttons -->
    <g transform="translate(36, 22)">
      <rect width="52" height="30" class="btn-approve"/>
      <text x="26" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">✓ تایید</text>

      <rect x="60" y="0" width="45" height="30" class="btn-reject"/>
      <text x="82.5" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">✕ رد</text>
    </g>
  </g>

  <!-- Row 2 -->
  <g transform="translate(0, 350)">
    <line x1="16" y1="130" x2="984" y2="130" stroke="#f1f5f9" stroke-width="1"/>

    <text x="948" y="32" fill="#0f172a" font-size="13" font-weight="800" text-anchor="end">آموزش ساخت ابزارهای بقا با</text>
    <text x="948" y="52" fill="#0f172a" font-size="13" font-weight="800" text-anchor="end">استفاده از منابع طبیعی</text>

    <!-- Keywords -->
    <g transform="translate(630, 20)">
      <rect x="110" y="0" width="70" height="22" class="pill-kw" rx="11"/>
      <text x="145" y="15" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">ابزار بقا</text>

      <rect x="25" y="0" width="78" height="22" class="pill-kw" rx="11"/>
      <text x="64" y="15" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">منابع طبیعی</text>

      <rect x="110" y="28" width="70" height="22" class="pill-kw" rx="11"/>
      <text x="145" y="43" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">بقا در طبیعت</text>
    </g>

    <!-- Category -->
    <rect x="520" y="20" width="90" height="24" class="pill-cat" rx="12"/>
    <text x="565" y="36" fill="#0369a1" font-size="11" font-weight="700" text-anchor="middle">بقا در طبیعت</text>

    <!-- Priority -->
    <rect x="410" y="20" width="80" height="24" class="badge-prio-mid" rx="12"/>
    <text x="450" y="36" fill="#854d0e" font-size="11" font-weight="800" text-anchor="middle">متوسط</text>

    <!-- Strategic Reason -->
    <text x="380" y="28" fill="#475569" font-size="11" font-weight="500" text-anchor="end">این موضوع می‌تواند به افرادی که به بقا در طبیعت علاقه دارند،</text>
    <text x="380" y="46" fill="#475569" font-size="11" font-weight="500" text-anchor="end">آموزش‌های مفیدی ارائه دهد و به غنای محتوای سایت کمک کند.</text>

    <!-- Buttons -->
    <g transform="translate(36, 22)">
      <rect width="52" height="30" class="btn-approve"/>
      <text x="26" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">✓ تایید</text>

      <rect x="60" y="0" width="45" height="30" class="btn-reject"/>
      <text x="82.5" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">✕ رد</text>
    </g>
  </g>

  <!-- Row 3 -->
  <g transform="translate(0, 485)">
    <line x1="16" y1="130" x2="984" y2="130" stroke="#f1f5f9" stroke-width="1"/>

    <text x="948" y="32" fill="#0f172a" font-size="13" font-weight="800" text-anchor="end">راهنمای انتخاب بهترین زمان</text>
    <text x="948" y="52" fill="#0f172a" font-size="13" font-weight="800" text-anchor="end">سفر به جنگل‌های شمال ایران</text>

    <!-- Keywords -->
    <g transform="translate(630, 20)">
      <rect x="110" y="0" width="70" height="22" class="pill-kw" rx="11"/>
      <text x="145" y="15" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">سفر به جنگل</text>

      <rect x="30" y="0" width="72" height="22" class="pill-kw" rx="11"/>
      <text x="66" y="15" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">زمان سفر</text>

      <rect x="110" y="28" width="70" height="22" class="pill-kw" rx="11"/>
      <text x="145" y="43" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">جنگل‌نوردی</text>
    </g>

    <!-- Category -->
    <rect x="520" y="20" width="90" height="24" class="pill-cat" rx="12"/>
    <text x="565" y="36" fill="#0369a1" font-size="11" font-weight="700" text-anchor="middle">مقاصد گردشگری</text>

    <!-- Priority -->
    <rect x="410" y="20" width="80" height="24" class="badge-prio-mid" rx="12"/>
    <text x="450" y="36" fill="#854d0e" font-size="11" font-weight="800" text-anchor="middle">متوسط</text>

    <!-- Strategic Reason -->
    <text x="380" y="28" fill="#475569" font-size="11" font-weight="500" text-anchor="end">در راستای تقویت بخش مقاصد گردشگری، بررسی زمان مناسب</text>
    <text x="380" y="46" fill="#475569" font-size="11" font-weight="500" text-anchor="end">برای سفر به جنگل‌های شمال ایران می‌تواند مخاطبان را جلب کند.</text>

    <!-- Buttons -->
    <g transform="translate(36, 22)">
      <rect width="52" height="30" class="btn-approve"/>
      <text x="26" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">✓ تایید</text>

      <rect x="60" y="0" width="45" height="30" class="btn-reject"/>
      <text x="82.5" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">✕ رد</text>
    </g>
  </g>

  <!-- Row 4 -->
  <g transform="translate(0, 620)">
    <line x1="16" y1="130" x2="984" y2="130" stroke="#f1f5f9" stroke-width="1"/>

    <text x="948" y="32" fill="#0f172a" font-size="13" font-weight="800" text-anchor="end">نکات مهم در مورد کمپینگ در</text>
    <text x="948" y="52" fill="#0f172a" font-size="13" font-weight="800" text-anchor="end">مناطق کوهستانی</text>

    <!-- Keywords -->
    <g transform="translate(630, 20)">
      <rect x="120" y="0" width="60" height="22" class="pill-kw" rx="11"/>
      <text x="150" y="15" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">کمپینگ</text>

      <rect x="20" y="0" width="90" height="22" class="pill-kw" rx="11"/>
      <text x="65" y="15" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">مناطق کوهستانی</text>

      <rect x="110" y="28" width="70" height="22" class="pill-kw" rx="11"/>
      <text x="145" y="43" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">تجهیزات کمپ</text>
    </g>

    <!-- Category -->
    <rect x="520" y="20" width="90" height="24" class="pill-cat" rx="12"/>
    <text x="565" y="36" fill="#0369a1" font-size="11" font-weight="700" text-anchor="middle">بقا در طبیعت</text>

    <!-- Priority -->
    <rect x="410" y="20" width="80" height="24" class="badge-prio-low" rx="12"/>
    <text x="450" y="36" fill="#0369a1" font-size="11" font-weight="800" text-anchor="middle">پایین</text>

    <!-- Strategic Reason -->
    <text x="380" y="28" fill="#475569" font-size="11" font-weight="500" text-anchor="end">این موضوع به عنوان یک راهنمای خاص برای کسانی که به کمپینگ</text>
    <text x="380" y="46" fill="#475569" font-size="11" font-weight="500" text-anchor="end">علاقه دارند می‌تواند مفید باشد، اما اولویت کمتری دارد.</text>

    <!-- Buttons -->
    <g transform="translate(36, 22)">
      <rect width="52" height="30" class="btn-approve"/>
      <text x="26" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">✓ تایید</text>

      <rect x="60" y="0" width="45" height="30" class="btn-reject"/>
      <text x="82.5" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">✕ رد</text>
    </g>
  </g>

  <!-- Row 5 -->
  <g transform="translate(0, 755)">
    <text x="948" y="32" fill="#0f172a" font-size="13" font-weight="800" text-anchor="end">نکات اساسی برای عکاسی از</text>
    <text x="948" y="52" fill="#0f172a" font-size="13" font-weight="800" text-anchor="end">پرندگان در طبیعت</text>

    <!-- Keywords -->
    <g transform="translate(630, 20)">
      <rect x="100" y="0" width="80" height="22" class="pill-kw" rx="11"/>
      <text x="140" y="15" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">عکاسی پرندگان</text>

      <rect x="10" y="0" width="82" height="22" class="pill-kw" rx="11"/>
      <text x="51" y="15" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">عکاسی طبیعت</text>

      <rect x="90" y="28" width="90" height="22" class="pill-kw" rx="11"/>
      <text x="135" y="43" fill="#475569" font-size="10" font-weight="600" text-anchor="middle">تکنیک‌های عکاسی</text>
    </g>

    <!-- Category -->
    <rect x="520" y="20" width="90" height="24" class="pill-cat" rx="12"/>
    <text x="565" y="36" fill="#0369a1" font-size="11" font-weight="700" text-anchor="middle">تکنیک‌های طبیعت</text>

    <!-- Priority -->
    <rect x="410" y="20" width="80" height="24" class="badge-prio-low" rx="12"/>
    <text x="450" y="36" fill="#0369a1" font-size="11" font-weight="800" text-anchor="middle">پایین</text>

    <!-- Strategic Reason -->
    <text x="380" y="28" fill="#475569" font-size="11" font-weight="500" text-anchor="end">این موضوع به عنوان یک زیرمجموعه خاص از عکاسی در طبیعت</text>
    <text x="380" y="46" fill="#475569" font-size="11" font-weight="500" text-anchor="end">می‌تواند به جذب عکاسان کمک کند، اما اولویت کمتری دارد.</text>

    <!-- Buttons -->
    <g transform="translate(36, 22)">
      <rect width="52" height="30" class="btn-approve"/>
      <text x="26" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">✓ تایید</text>

      <rect x="60" y="0" width="45" height="30" class="btn-reject"/>
      <text x="82.5" y="19" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">✕ رد</text>
    </g>
  </g>

  <!-- Bottom WP Footer -->
  <g transform="translate(16, 925)">
    <text x="0" y="12" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="start">دریافت: نگارش 7.0.3</text>
    <text x="968" y="12" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="end">کشف فرصت‌های محتوایی / تنظیمات / مسیر / راهنما</text>
  </g>
</svg>
