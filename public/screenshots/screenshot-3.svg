<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" style="background-color: #f1f3f5;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif; direction: rtl; unicode-bidi: embed; }
      .bg-app { fill: #f1f3f5; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 10px; }
      .badge-online { fill: #dcfce7; stroke: #86efac; stroke-width: 0.5; }
      .badge-prio-high { fill: #fce7f3; stroke: #f472b6; stroke-width: 0.5; }
      .badge-prio-mid { fill: #fef9c3; stroke: #fde047; stroke-width: 0.5; }
      .badge-prio-low { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 0.5; }
      .btn-blue { fill: #2563eb; rx: 6px; }
      .btn-approve { fill: #2563eb; rx: 4px; }
      .btn-reject { fill: #dc2626; rx: 4px; }
      .tab-active { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; rx: 6px; }
      .tab-inactive { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 6px; }
      .chip-kw { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 0.5; rx: 10px; }
      .chip-cat { fill: #e0f2fe; stroke: #bae6fd; stroke-width: 0.5; rx: 10px; }
    </style>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" class="bg-app"/>

  <!-- Top Header -->
  <rect x="16" y="16" width="968" height="90" class="card" filter="url(#shadow)"/>
  
  <g transform="translate(36, 40)">
    <rect width="210" height="42" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
    <text x="105" y="26" fill="#1e293b" font-size="12" font-weight="700" text-anchor="middle">🔍 اسکن سایت برای یافتن شکاف‌های محتوا</text>
  </g>

  <g transform="translate(952, 48)">
    <text x="0" y="0" fill="#0f172a" font-size="19" font-weight="800" text-anchor="end">🔎 کشف فرصت‌های محتوا</text>
    <rect x="-380" y="-18" width="200" height="24" class="badge-online" rx="12"/>
    <text x="-280" y="-2" fill="#15803d" font-size="11" font-weight="700" text-anchor="middle">ارتباط هوش مصنوعی: آنلاین (OPENROUTER)</text>
    <text x="0" y="26" fill="#64748b" font-size="12" font-weight="500" text-anchor="end">تحلیل هوشمند ساختار وب‌سایت شما و کلیدواژه‌های مناسب جهت استخراج فرصت‌ها و موضوعات غایب.</text>
  </g>

  <!-- Toolbar Row -->
  <g transform="translate(16, 118)">
    <g transform="translate(0, 0)">
      <text x="280" y="24" fill="#64748b" font-size="11" text-anchor="end">خروجی گرفتن:</text>
      <rect x="150" y="0" width="85" height="34" class="tab-inactive"/>
      <text x="192" y="21" fill="#2563eb" font-size="11" font-weight="700" text-anchor="middle">📥 دانلود CSV</text>

      <rect x="50" y="0" width="90" height="34" class="tab-inactive"/>
      <text x="95" y="21" fill="#2563eb" font-size="11" font-weight="700" text-anchor="middle">📥 دانلود JSON</text>
    </g>

    <g transform="translate(420, 0)">
      <rect x="290" y="0" width="130" height="34" class="tab-active"/>
      <text x="355" y="21" fill="#2563eb" font-size="11.5" font-weight="800" text-anchor="middle">فرصت‌های فعال 5</text>

      <rect x="150" y="0" width="130" height="34" class="tab-inactive"/>
      <text x="215" y="21" fill="#15803d" font-size="11.5" font-weight="700" text-anchor="middle">فرصت‌های تایید شده 1</text>

      <rect x="10" y="0" width="130" height="34" class="tab-inactive"/>
      <text x="75" y="21" fill="#dc2626" font-size="11.5" font-weight="700" text-anchor="middle">فرصت‌های رد شده 9</text>
    </g>

    <g transform="translate(16, 44)">
      <rect width="936" height="38" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="6"/>
      <text x="918" y="24" fill="#94a3b8" font-size="12" font-weight="500" text-anchor="end">جستجو در عنوان، کلمات کلیدی، دسته‌بندی یا دلیل استراتژیک...</text>
    </g>
  </g>

  <!-- Table Section -->
  <g transform="translate(16, 212)">
    <rect width="968" height="710" class="card" filter="url(#shadow)"/>

    <rect x="0" y="0" width="968" height="42" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <g transform="translate(0, 26)">
      <text x="948" y="0" fill="#334155" font-size="12" font-weight="800" text-anchor="end">عنوان / موضوع</text>
      <text x="730" y="0" fill="#334155" font-size="12" font-weight="800" text-anchor="end">کلمات کلیدی هدف</text>
      <text x="560" y="0" fill="#334155" font-size="12" font-weight="800" text-anchor="end">دسته‌بندی محتوا</text>
      <text x="450" y="0" fill="#334155" font-size="12" font-weight="800" text-anchor="end">اولویت</text>
      <text x="340" y="0" fill="#334155" font-size="12" font-weight="800" text-anchor="end">دلیل استراتژیک</text>
      <text x="80" y="0" fill="#334155" font-size="12" font-weight="800" text-anchor="end">عملیات</text>
    </g>

    <!-- Row 1 -->
    <g transform="translate(0, 42)">
      <line x1="0" y1="130" x2="968" y2="130" stroke="#f1f5f9" stroke-width="1"/>
      <text x="948" y="32" fill="#0f172a" font-size="12" font-weight="800" text-anchor="end">نکات کلیدی برای انتخاب</text>
      <text x="948" y="52" fill="#0f172a" font-size="12" font-weight="800" text-anchor="end">بهترین زمان سفر به کویر</text>

      <!-- Keywords -->
      <g transform="translate(620, 20)">
        <rect x="30" y="0" width="80" height="20" class="chip-kw"/><text x="70" y="14" fill="#475569" font-size="10" text-anchor="middle">سفر به کویر</text>
        <rect x="20" y="24" width="90" height="20" class="chip-kw"/><text x="65" y="38" fill="#475569" font-size="10" text-anchor="middle">زمان مناسب سفر</text>
        <rect x="40" y="48" width="70" height="20" class="chip-kw"/><text x="75" y="62" fill="#475569" font-size="10" text-anchor="middle">کویرنوردی</text>
      </g>

      <rect x="500" y="24" width="85" height="22" class="chip-cat"/>
      <text x="542" y="39" fill="#0369a1" font-size="10.5" font-weight="700" text-anchor="middle">مقاصد گردشگری</text>

      <rect x="415" y="24" width="60" height="22" class="badge-prio-high" rx="11"/>
      <text x="445" y="39" fill="#9d174d" font-size="10" font-weight="800" text-anchor="middle">بالا (فوری)</text>

      <g transform="translate(380, 24)">
        <text x="0" y="12" fill="#475569" font-size="10.5" text-anchor="end">این موضوع به دلیل اهمیت زیادش در سفر به کویر</text>
        <text x="0" y="28" fill="#475569" font-size="10.5" text-anchor="end">و تأثیر آن بر تجربه گردشگری، یک ضرورت است.</text>
        <text x="0" y="44" fill="#475569" font-size="10.5" text-anchor="end">افزودن این مطلب به جذب مخاطبان کمک می‌کند.</text>
      </g>

      <g transform="translate(20, 24)">
        <rect x="55" y="0" width="50" height="28" class="btn-approve"/>
        <text x="80" y="18" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">تایید</text>

        <rect x="0" y="0" width="45" height="28" class="btn-reject"/>
        <text x="22" y="18" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">رد</text>
      </g>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 172)">
      <line x1="0" y1="130" x2="968" y2="130" stroke="#f1f5f9" stroke-width="1"/>
      <text x="948" y="32" fill="#0f172a" font-size="12" font-weight="800" text-anchor="end">آموزش ساخت ابزارهای بقا با</text>
      <text x="948" y="52" fill="#0f172a" font-size="12" font-weight="800" text-anchor="end">استفاده از منابع طبیعی</text>

      <g transform="translate(620, 20)">
        <rect x="40" y="0" width="70" height="20" class="chip-kw"/><text x="75" y="14" fill="#475569" font-size="10" text-anchor="middle">ابزار بقا</text>
        <rect x="30" y="24" width="80" height="20" class="chip-kw"/><text x="70" y="38" fill="#475569" font-size="10" text-anchor="middle">منابع طبیعی</text>
        <rect x="30" y="48" width="80" height="20" class="chip-kw"/><text x="70" y="62" fill="#475569" font-size="10" text-anchor="middle">بقا در طبیعت</text>
      </g>

      <rect x="500" y="24" width="85" height="22" class="chip-cat"/>
      <text x="542" y="39" fill="#0369a1" font-size="10.5" font-weight="700" text-anchor="middle">بقا در طبیعت</text>

      <rect x="415" y="24" width="55" height="22" class="badge-prio-mid" rx="11"/>
      <text x="442" y="39" fill="#854d0e" font-size="10" font-weight="800" text-anchor="middle">متوسط</text>

      <g transform="translate(380, 24)">
        <text x="0" y="12" fill="#475569" font-size="10.5" text-anchor="end">این موضوع می‌تواند به افرادی که به بقا در طبیعت</text>
        <text x="0" y="28" fill="#475569" font-size="10.5" text-anchor="end">علاقه دارند، آموزش‌های مفیدی ارائه دهد و به</text>
        <text x="0" y="44" fill="#475569" font-size="10.5" text-anchor="end">غنای محتوای سایت کمک کند.</text>
      </g>

      <g transform="translate(20, 24)">
        <rect x="55" y="0" width="50" height="28" class="btn-approve"/>
        <text x="80" y="18" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">تایید</text>

        <rect x="0" y="0" width="45" height="28" class="btn-reject"/>
        <text x="22" y="18" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">رد</text>
      </g>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 302)">
      <line x1="0" y1="130" x2="968" y2="130" stroke="#f1f5f9" stroke-width="1"/>
      <text x="948" y="32" fill="#0f172a" font-size="12" font-weight="800" text-anchor="end">راهنمای انتخاب بهترین زمان</text>
      <text x="948" y="52" fill="#0f172a" font-size="12" font-weight="800" text-anchor="end">سفر به جنگل‌های شمال ایران</text>

      <g transform="translate(620, 20)">
        <rect x="30" y="0" width="80" height="20" class="chip-kw"/><text x="70" y="14" fill="#475569" font-size="10" text-anchor="middle">سفر به جنگل</text>
        <rect x="40" y="24" width="70" height="20" class="chip-kw"/><text x="75" y="38" fill="#475569" font-size="10" text-anchor="middle">زمان سفر</text>
        <rect x="35" y="48" width="75" height="20" class="chip-kw"/><text x="72" y="62" fill="#475569" font-size="10" text-anchor="middle">جنگل‌نوردی</text>
      </g>

      <rect x="500" y="24" width="85" height="22" class="chip-cat"/>
      <text x="542" y="39" fill="#0369a1" font-size="10.5" font-weight="700" text-anchor="middle">مقاصد گردشگری</text>

      <rect x="415" y="24" width="55" height="22" class="badge-prio-mid" rx="11"/>
      <text x="442" y="39" fill="#854d0e" font-size="10" font-weight="800" text-anchor="middle">متوسط</text>

      <g transform="translate(380, 24)">
        <text x="0" y="12" fill="#475569" font-size="10.5" text-anchor="end">در راستای تقویت بخش مقاصد گردشگری، بررسی</text>
        <text x="0" y="28" fill="#475569" font-size="10.5" text-anchor="end">زمان مناسب برای سفر به جنگل‌های شمال ایران</text>
        <text x="0" y="44" fill="#475569" font-size="10.5" text-anchor="end">می‌تواند مخاطبان را به سمت انتخاب این مقصد جذب کند.</text>
      </g>

      <g transform="translate(20, 24)">
        <rect x="55" y="0" width="50" height="28" class="btn-approve"/>
        <text x="80" y="18" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">تایید</text>

        <rect x="0" y="0" width="45" height="28" class="btn-reject"/>
        <text x="22" y="18" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">رد</text>
      </g>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0, 432)">
      <line x1="0" y1="130" x2="968" y2="130" stroke="#f1f5f9" stroke-width="1"/>
      <text x="948" y="32" fill="#0f172a" font-size="12" font-weight="800" text-anchor="end">نکات مهم در مورد کمپینگ در</text>
      <text x="948" y="52" fill="#0f172a" font-size="12" font-weight="800" text-anchor="end">مناطق کوهستانی</text>

      <g transform="translate(620, 20)">
        <rect x="50" y="0" width="60" height="20" class="chip-kw"/><text x="80" y="14" fill="#475569" font-size="10" text-anchor="middle">کمپینگ</text>
        <rect x="20" y="24" width="90" height="20" class="chip-kw"/><text x="65" y="38" fill="#475569" font-size="10" text-anchor="middle">مناطق کوهستانی</text>
        <rect x="25" y="48" width="85" height="20" class="chip-kw"/><text x="67" y="62" fill="#475569" font-size="10" text-anchor="middle">تجهیزات کمپ</text>
      </g>

      <rect x="500" y="24" width="85" height="22" class="chip-cat"/>
      <text x="542" y="39" fill="#0369a1" font-size="10.5" font-weight="700" text-anchor="middle">بقا در طبیعت</text>

      <rect x="415" y="24" width="50" height="22" class="badge-prio-low" rx="11"/>
      <text x="440" y="39" fill="#475569" font-size="10" font-weight="800" text-anchor="middle">پایین</text>

      <g transform="translate(380, 24)">
        <text x="0" y="12" fill="#475569" font-size="10.5" text-anchor="end">این موضوع به عنوان یک راهنمای خاص برای کسانی</text>
        <text x="0" y="28" fill="#475569" font-size="10.5" text-anchor="end">که به کمپینگ در مناطق کوهستانی علاقه دارند،</text>
        <text x="0" y="44" fill="#475569" font-size="10.5" text-anchor="end">مفید باشد، اما به دلیل خاص بودن اولویت کمتری دارد.</text>
      </g>

      <g transform="translate(20, 24)">
        <rect x="55" y="0" width="50" height="28" class="btn-approve"/>
        <text x="80" y="18" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">تایید</text>

        <rect x="0" y="0" width="45" height="28" class="btn-reject"/>
        <text x="22" y="18" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">رد</text>
      </g>
    </g>

    <!-- Row 5 -->
    <g transform="translate(0, 562)">
      <text x="948" y="32" fill="#0f172a" font-size="12" font-weight="800" text-anchor="end">نکات اساسی برای عکاسی از</text>
      <text x="948" y="52" fill="#0f172a" font-size="12" font-weight="800" text-anchor="end">پرندگان در طبیعت</text>

      <g transform="translate(620, 20)">
        <rect x="25" y="0" width="85" height="20" class="chip-kw"/><text x="67" y="14" fill="#475569" font-size="10" text-anchor="middle">عکاسی پرندگان</text>
        <rect x="30" y="24" width="80" height="20" class="chip-kw"/><text x="70" y="38" fill="#475569" font-size="10" text-anchor="middle">عکاسی طبیعت</text>
        <rect x="20" y="48" width="90" height="20" class="chip-kw"/><text x="65" y="62" fill="#475569" font-size="10" text-anchor="middle">تکنیک‌های عکاسی</text>
      </g>

      <rect x="490" y="24" width="105" height="22" class="chip-cat"/>
      <text x="542" y="39" fill="#0369a1" font-size="10.5" font-weight="700" text-anchor="middle">تکنیک‌های طبیعت‌گردی</text>

      <rect x="415" y="24" width="50" height="22" class="badge-prio-low" rx="11"/>
      <text x="440" y="39" fill="#475569" font-size="10" font-weight="800" text-anchor="middle">پایین</text>

      <g transform="translate(380, 24)">
        <text x="0" y="12" fill="#475569" font-size="10.5" text-anchor="end">این موضوع به عنوان یک زیرمجموعه خاص از عکاسی</text>
        <text x="0" y="28" fill="#475569" font-size="10.5" text-anchor="end">در طبیعت می‌تواند به جذب علاقه‌مندان به عکاسی</text>
        <text x="0" y="44" fill="#475569" font-size="10.5" text-anchor="end">کمک کند، اما به دلیل خاص بودن اولویت کمتری دارد.</text>
      </g>

      <g transform="translate(20, 24)">
        <rect x="55" y="0" width="50" height="28" class="btn-approve"/>
        <text x="80" y="18" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">تایید</text>

        <rect x="0" y="0" width="45" height="28" class="btn-reject"/>
        <text x="22" y="18" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">رد</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(16, 945)">
    <text x="16" y="20" fill="#2563eb" font-size="12" font-weight="600">دریافت: نگارش 7.0.3</text>
    <text x="952" y="20" fill="#64748b" font-size="12" font-weight="500" text-anchor="end">کشف فرصت‌های محتوایی / تنظیمات / مسیر / راهنما</text>
  </g>
</svg>