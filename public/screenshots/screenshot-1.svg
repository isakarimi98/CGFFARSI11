<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; direction: rtl; unicode-bidi: embed; }
      .bg-app { fill: #f0f2f5; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 8px; }
      .btn-blue { fill: #2563eb; rx: 6px; }
      .btn-blue:hover { fill: #1d4ed8; }
      .tab-active { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 6px 6px 0 0; }
      .tab-inactive { fill: #e2e8f0; rx: 6px 6px 0 0; }
      .badge-blue { fill: #2563eb; rx: 10px; }
      .badge-green { fill: #16a34a; rx: 10px; }
      .badge-red { fill: #dc2626; rx: 10px; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="620" class="bg-app"/>

  <!-- Top Header Bar -->
  <rect x="20" y="20" width="1160" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="8" filter="url(#shadow)"/>
  
  <!-- Left Header Action Button -->
  <g transform="translate(40, 38)">
    <rect width="210" height="42" class="btn-blue"/>
    <text x="180" y="26" fill="#ffffff" font-size="12.5" font-weight="700" text-anchor="start">اسکن سایت برای یافتن شکاف‌های محتوا</text>
    <path d="M22 28l-4-4m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Right Header Info -->
  <g transform="translate(1140, 48)">
    <text x="0" y="0" fill="#0f172a" font-size="18" font-weight="800" text-anchor="end">🔍 کشف فرصت‌های محتوا</text>
    <circle cx="-185" cy="-6" r="4" fill="#22c55e"/>
    <text x="-195" y="0" fill="#16a34a" font-size="11" font-weight="700" text-anchor="end">ارتباط هوش مصنوعی: آنلاین (OPENROUTER)</text>
    <text x="0" y="24" fill="#64748b" font-size="12" font-weight="500" text-anchor="end">تحلیل هوشمند ساختار پست‌ها، دسته‌بندی‌ها و کلیدواژه‌های سایت جهت استخراج فرصت‌ها و موضوعات غایب.</text>
  </g>

  <!-- Tabs Bar -->
  <g transform="translate(20, 125)">
    <!-- Active Tab: Active Opportunities -->
    <g transform="translate(1000, 0)">
      <rect width="160" height="38" class="tab-active"/>
      <text x="140" y="24" fill="#1e293b" font-size="13" font-weight="700" text-anchor="end">فرصت‌های فعال</text>
      <rect x="15" y="8" width="22" height="22" class="badge-blue"/>
      <text x="26" y="23" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">0</text>
    </g>

    <!-- Tab: Approved Opportunities -->
    <g transform="translate(830, 0)">
      <rect width="160" height="38" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6 6 0 0"/>
      <text x="140" y="24" fill="#475569" font-size="13" font-weight="600" text-anchor="end">فرصت‌های تایید شده</text>
      <circle cx="26" cy="19" r="11" fill="#16a34a"/>
      <text x="26" y="23" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">✓ 1</text>
    </g>

    <!-- Tab: Rejected Opportunities -->
    <g transform="translate(660, 0)">
      <rect width="160" height="38" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6 6 0 0"/>
      <text x="140" y="24" fill="#475569" font-size="13" font-weight="600" text-anchor="end">فرصت‌های رد شده</text>
      <circle cx="26" cy="19" r="11" fill="#dc2626"/>
      <text x="26" y="23" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">✕ 9</text>
    </g>

    <!-- Border Line below tabs -->
    <line x1="0" y1="38" x2="1160" y2="38" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Main Center Card -->
  <rect x="20" y="175" width="1160" height="420" class="card" filter="url(#shadow)"/>

  <g transform="translate(600, 310)">
    <!-- Lightbulb Icon Circle -->
    <circle cx="0" cy="-40" r="32" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <path d="M-10 -48a12 12 0 0 1 20 0c0 5 -4 8 -5 11h-10c-1 -3 -5 -6 -5 -11zM-5 -33h10M-3 -29h6" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Persian Prompt Instruction -->
    <text x="0" y="15" fill="#334155" font-size="15" font-weight="700" text-anchor="middle">برای تحلیل هوشمند ساختار سایت و کشف فرصت‌ها و شکاف‌های محتوایی جدید، لطفاً</text>
    <text x="0" y="40" fill="#334155" font-size="15" font-weight="700" text-anchor="middle">روی دکمه «اسکن سایت برای یافتن شکاف‌های محتوا» کلیک کنید.</text>

    <!-- Primary Action Button -->
    <g transform="translate(-125, 75)">
      <rect width="250" height="48" rx="8" fill="#2563eb"/>
      <text x="120" y="29" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">شروع اسکن هوشمند محتوای سایت</text>
      <path d="M210 31l-4-4m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
