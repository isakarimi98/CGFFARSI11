      <text x="680" y="45" fill="#475569" font-size="12.5" font-weight="600" text-anchor="end">1 مقاله</text>
      <text x="480" y="45" fill="#475569" font-size="12.5" font-weight="600" text-anchor="end">5 فرصت</text>
      <text x="310" y="45" fill="#16a34a" font-size="12.5" font-weight="700" text-anchor="end">0 تأییدشده</text>
