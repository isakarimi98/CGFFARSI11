<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; direction: rtl; unicode-bidi: embed; }
      .bg-app { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 12px; }
      .btn-blue { fill: #2563eb; rx: 8px; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" class="bg-app"/>

  <!-- Top Header Bar -->
  <rect x="24" y="24" width="752" height="110" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="12" filter="url(#shadow)"/>
  
  <g transform="translate(48, 52)">
    <rect width="210" height="50" class="btn-blue"/>
    <text x="180" y="31" fill="#ffffff" font-size="13" font-weight="700" text-anchor="start">اسکن سایت برای یافتن شکاف‌ها 🔍</text>
  </g>

  <g transform="translate(748, 62)">
    <text x="0" y="0" fill="#0f172a" font-size="20" font-weight="800" text-anchor="end">🔍 کشف فرصت‌های محتوا</text>
    <circle cx="-190" cy="-6" r="4" fill="#22c55e"/>
    <text x="-200" y="0" fill="#16a34a" font-size="12" font-weight="700" text-anchor="end">ارتباط هوش مصنوعی: آنلاین</text>
    <text x="0" y="28" fill="#64748b" font-size="12" font-weight="500" text-anchor="end">تحلیل هوشمند ساختار پست‌ها، دسته‌بندی‌ها و کلیدواژه‌های سایت جهت استخراج موضوعات.</text>
  </g>

  <!-- Tabs Bar -->
  <g transform="translate(24, 160)">
    <rect x="520" y="0" width="232" height="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="8 8 0 0"/>
    <text x="730" y="26" fill="#0f172a" font-size="13" font-weight="800" text-anchor="end">فرصت‌های فعال (0)</text>

    <rect x="270" y="0" width="232" height="42" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="8 8 0 0"/>
    <text x="480" y="26" fill="#64748b" font-size="13" font-weight="600" text-anchor="end">فرصت‌های تایید شده (1)</text>

    <rect x="20" y="0" width="232" height="42" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="8 8 0 0"/>
    <text x="230" y="26" fill="#64748b" font-size="13" font-weight="600" text-anchor="end">فرصت‌های رد شده (9)</text>

    <line x1="0" y1="42" x2="752" y2="42" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Main Scan Card Area -->
  <rect x="24" y="230" width="752" height="546" class="card" filter="url(#shadow)"/>

  <!-- Center Bulb & Message -->
  <g transform="translate(400, 430)">
    <circle cx="0" cy="-60" r="42" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="0" y="-48" font-size="36" text-anchor="middle">💡</text>

    <text x="0" y="20" fill="#1e293b" font-size="17" font-weight="800" text-anchor="middle">آماده‌سازی اسکن هوشمند سایت</text>
    <text x="0" y="50" fill="#64748b" font-size="13" font-weight="500" text-anchor="middle">برای تحلیل ساختار سایت و کشف فرصت‌ها و شکاف‌های محتوایی جدید،</text>
    <text x="0" y="75" fill="#64748b" font-size="13" font-weight="500" text-anchor="middle">لطفاً روی دکمه زیر کلیک کنید.</text>

    <!-- Center Scan Button -->
    <g transform="translate(-130, 110)">
      <rect width="260" height="52" fill="#2563eb" rx="10" filter="url(#shadow)"/>
      <text x="130" y="32" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">شروع اسکن هوشمند محتوای سایت 🔍</text>
    </g>
  </g>
</svg>
