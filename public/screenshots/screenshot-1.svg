      <text x="948" y="45" fill="#0f172a" font-size="13" font-weight="700" text-anchor="end">تکنیک‌های طبیعت‌گردی •</text>
      <text x="680" y="45" fill="#475569" font-size="12.5" font-weight="600" text-anchor="end">4 مقاله</text>
      <text x="480" y="45" fill="#475569" font-size="12.5" font-weight="600" text-anchor="end">3 فرصت</text>
      <text x="310" y="45" fill="#16a34a" font-size="12.5" font-weight="700" text-anchor="end">0 تأییدشده</text>
      <rect x="50" y="34" width="100" height="10" class="progress-bg"/>
      <text x="32" y="44" fill="#64748b" font-size="11" font-weight="700" text-anchor="end">0%</text>
